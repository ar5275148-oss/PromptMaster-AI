<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="innerDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>
  </defs>

  <!-- Outer Squircle with Brand Gradient Border -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#brandGrad)" />
  
  <!-- Inner Dark Core -->
  <rect x="44" y="44" width="424" height="424" rx="112" fill="url(#innerDark)" stroke="#1e293b" stroke-width="4" />

  <!-- Glowing Assistant Pulse Indicator Top Right -->
  <circle cx="390" cy="120" r="16" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="390" cy="120" r="10" fill="#a5f3fc" />

  <!-- Robot Head Outline / Geometry -->
  <g transform="translate(106, 126)" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Antenna -->
    <path d="M150 14 V54" stroke="#38bdf8" stroke-width="16" />
    <circle cx="150" cy="14" r="12" fill="#22d3ee" stroke="none" filter="url(#glow)" />
    
    <!-- Main Head Box -->
    <rect x="20" y="54" width="260" height="200" rx="48" fill="#0b1329" stroke="url(#brandGrad)" stroke-width="16" />

    <!-- Robot Left & Right Ear Connectors -->
    <path d="M0 134 H20" stroke="#38bdf8" stroke-width="14" />
    <path d="M280 134 H300" stroke="#38bdf8" stroke-width="14" />

    <!-- Robot Eyes (Glowing Cyan) -->
    <circle cx="95" cy="130" r="22" fill="#22d3ee" stroke="none" filter="url(#glow)" />
    <circle cx="95" cy="130" r="12" fill="#ffffff" stroke="none" />
    
    <circle cx="205" cy="130" r="22" fill="#22d3ee" stroke="none" filter="url(#glow)" />
    <circle cx="205" cy="130" r="12" fill="#ffffff" stroke="none" />

    <!-- Robot Smile / Mouth Line -->
    <path d="M90 196 Q150 226 210 196" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
